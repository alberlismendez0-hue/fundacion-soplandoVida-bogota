  <!-- Complementary life sprout in green -->
  <path d="M52 40 C58 35, 68 36, 74 42 C78 46, 80 54, 76 60 C72 66, 64 68, 56 68" 
        stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
