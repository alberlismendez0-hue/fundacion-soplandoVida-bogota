  <rect width="100" height="100" rx="24" fill="#F0F9FF" />
  <!-- Protective swirling leaves/breeze of life -->
  <path d="M50 16 C30 16, 16 32, 16 52 C16 70, 32 84, 52 84 C72 84, 84 68, 84 50 C84 36, 72 26, 60 26 C46 26, 36 36, 36 48 C36 58, 44 66, 54 66 C62 66, 68 60, 68 52 C68 46, 63 42, 57 42 C52 42, 48 45, 48 50" 
